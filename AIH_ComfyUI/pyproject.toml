[project]
name = "AIH-ComfyUI"
version = "0.1.0"
description = "AIH Elements Picker & Prompt Enhancer for ComfyUI"
authors = [
    {name = "Holaf", email = ""},
]
license = {text = "MIT"}
requires-python = ">=3.10"

[project.urls]
Repository = "https://github.com/grokuku/AIH_Tools"
"ComfyUI Registry" = "https://registry.comfy.org/publishers/grokuku/nodes/aih-tools"

[comfyui]
nodes = [
    "nodes.elements_node.AIHElementsNode",
    "nodes.enhance_node.AIHEnhanceNode",
    "nodes.ideogram4_node.AIHIdeogram4Node",
    "nodes.ideogram_prep_node.AIHIdeogramPrepNode",
    "nodes.ideogram_parse_node.AIHIdeogramParseNode",
    "nodes.prep_node.AIHPromptPrepNode",
]

[tool.comfyui.registry]
display_name = "AIH"
icon = ""
category = "Prompt/Generation"
description = "AIH Elements Picker & Prompt Enhancer — générez et optimisez vos prompts d'images via l'API kw.holaf.fr"
